title: Dostlarınızın Sağlığı İçin Sevgi ve Özenle...
title_en: With Love and Care for Your Pets’ Health...
intro: 2020 yılından bu yana Adana’da hizmet veren Güzelyalı Veteriner Kliniği, evcil hayvanların sağlıklı, mutlu ve konforlu bir yaşam sürmelerine katkıda bulunmayı amaçlamaktadır.
intro_en: Serving Adana since 2020, Güzelyalı Veterinary Clinic aims to help pets lead healthy, happy and comfortable lives.
paragraphs:
  - text: Dostlarımızın sağlığını ve yaşam kalitesini ön planda tutarak genel muayene, teşhis, tedavi, cerrahi müdahaleler, aşılama ve koruyucu hekimlik gibi kapsamlı veteriner sağlık hizmetleri sunuyoruz.
    text_en: "Putting our patients’ health and quality of life first, we offer comprehensive veterinary care: general examinations, diagnosis, treatment, surgery, vaccinations and preventive medicine."
  - text: Veteriner hekimlik hizmetlerimizin yanı sıra beslenme danışmanlığı, veteriner diyet mamaları, mama çeşitleri, bakım ürünleri ve evcil hayvan aksesuarlarıyla dostlarımızın günlük ihtiyaçlarına da çözüm üretiyoruz.
    text_en: Alongside our veterinary services, we also look after everyday needs with nutrition advice, veterinary diet foods, a range of pet food, care products and pet accessories.
  - text: Güzelyalı Veteriner Kliniği olarak bilgi, deneyim ve hayvan sevgisini bir araya getiriyor; her dostumuzun ihtiyaçlarına özenle yaklaşarak onların ve ailelerinin yanında olmaya devam ediyoruz.
    text_en: At Güzelyalı Veterinary Clinic we bring together knowledge, experience and a love of animals, meeting each patient’s needs with care and standing by them and their families.
