vet_name: Salim Hakveren
vet_photo: /assets/img/uploads/salim-hakveren.jpg
vet_text: Salim Hakveren, Güzelyalı Veteriner Kliniği’nin kurucusu ve veteriner hekimidir. Kliniğe gelen hastaların muayenesini, teşhis ve tedavisini, cerrahi müdahalelerini yürütür.
vet_text_en: Salim Hakveren is the founder and veterinarian of Güzelyalı Veterinary Clinic. He carries out the examinations, diagnosis, treatment and surgery of the patients who come to the clinic.
