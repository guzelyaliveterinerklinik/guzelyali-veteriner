items:
  - name: Turgay K.
    text: Salim Bey çok iyi bir hekim. Üstelik insan ilişkileri ve bilgisi çok iyi.
    text_en: Salim is a very good vet, and he is great with people and very knowledgeable.
  - name: Hüseyin Emre T.
    text: Kedime verdiğim yanlış ilaç sonucu gece saatlerinde burayı aradım. Hocam direkt çıkıp gelin dedi.
    text_en: I called late at night after giving my cat the wrong medicine. He told me to come straight over.
  - name: Galip Y.
    text: Kedimizin aşılarını ve tırnak kesimi gibi bakımlarını güvenle yaptırdığımız bir yer.
    text_en: A place we trust with our cat’s vaccinations and care such as nail trimming.
  - name: Emir F.
    text: Yıllardır veterinerimiz olur. Her çalışanı gayet ilgili insanlar.
    text_en: They have been our vet for years. Everyone who works there is very attentive.
